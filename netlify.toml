[build]
  base = "frontend"
  command = "npm run build -- --webpack"
  publish = ".next"
  edge_functions = "netlify/edge-functions"

# Without the adapter Netlify publishes the raw .next folder and every route 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_API_BASE_URL = ""
  NEXT_PUBLIC_DEMO_LOGIN = "1"

# BACKEND_ORIGIN and FRACXION_PROXY_SECRET belong in the Netlify dashboard,
# available to Functions in the production context. Never commit their values.
[[edge_functions]]
  function = "backend"
  path = "/api/*"

[[edge_functions]]
  function = "backend"
  path = "/admin"

[[edge_functions]]
  function = "backend"
  path = "/admin/*"

[[edge_functions]]
  function = "backend"
  path = "/static/*"
