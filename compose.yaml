services:
  database:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: facturador
      POSTGRES_USER: facturador
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Complete POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturador -d facturador"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  cache:
    image: redis:8-bookworm
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [private]

  backend: &backend_service
    build: ./backend
    restart: unless-stopped
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Complete DJANGO_SECRET_KEY}
      MFA_ENCRYPTION_KEYS: ${MFA_ENCRYPTION_KEYS:?Complete MFA_ENCRYPTION_KEYS}
      DJANGO_ALLOWED_HOSTS: ${SITE_DOMAIN:?Complete SITE_DOMAIN}
      DB_NAME: facturador
      DB_USER: facturador
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: database
      DB_PORT: "5432"
      DB_SSLMODE: disable
      REDIS_URL: redis://cache:6379/1
      CORS_ALLOWED_ORIGINS: https://${SITE_DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${SITE_DOMAIN}
      FRONTEND_PASSWORD_RESET_URL: https://${SITE_DOMAIN}/reset-password
      TRUST_PROXY_HTTPS: "True"
      TRUSTED_PROXY_NETWORKS: 172.29.33.10/32
      DJANGO_EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      EMAIL_HOST: ${EMAIL_HOST:?Complete EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
    depends_on:
      database: {condition: service_healthy}
      cache: {condition: service_healthy}
    networks: [private]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/ready/', headers={'Host': __import__('os').environ['DJANGO_ALLOWED_HOSTS'].split(',')[0]}), timeout=5)"]
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 30s

  worker:
    <<: *backend_service
    command: ["python", "manage.py", "run_jobs"]
    stop_grace_period: 15s
    depends_on:
      backend: {condition: service_healthy}
      database: {condition: service_healthy}
      cache: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "manage.py", "job_worker_health"]
      interval: 15s
      timeout: 7s
      retries: 3
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [private]

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend, frontend]
    networks:
      private: {ipv4_address: 172.29.33.10}

networks:
  private:
    ipam:
      config: [{subnet: 172.29.33.0/24}]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
