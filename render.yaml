# All provisioned resources explicitly use Free. PostgreSQL lives in Neon.
services:
  - type: keyvalue
    name: fracxion-cache
    region: virginia
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: fracxion-api
    runtime: docker
    region: virginia
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python render_start.py
    healthCheckPath: /ready/
    autoDeployTrigger: "off"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.render_settings
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: MFA_ENCRYPTION_KEYS
        sync: false
      - key: FRACXION_PROXY_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fracxion-cache
          property: connectionString
      - key: TRUST_PROXY_HTTPS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_PASSWORD_RESET_URL
        sync: false
      - key: DJANGO_EMAIL_BACKEND
        value: config.email_backend.BrevoEmailBackend
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
