openapi: 3.0.3
info:
  title: Facturador SaaS API
  version: 0.1.0
  description: API multi-tenant de facturación, gestión empresarial y auditoría.
paths:
  /api/auth/tenants/:
    get:
      operationId: auth_tenants_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantList'
          description: ''
  /api/reference/countries/:
    get:
      operationId: reference_countries_retrieve
      description: Devuelve los países reconocidos por el catálogo ISO.
      tags:
      - reference
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceList'
          description: ''
  /api/reference/countries/{country_code}/subdivisions/:
    get:
      operationId: reference_countries_subdivisions_retrieve
      description: Devuelve las subdivisiones registradas para un país ISO.
      parameters:
      - in: path
        name: country_code
        schema:
          type: string
        required: true
      tags:
      - reference
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceList'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/tenants/{tenant_id}/audit-events/:
    get:
      operationId: tenants_audit_events_list
      description: |-
        API de consulta del historial de auditoría.

        Solo permite listar y consultar eventos de la empresa
        autorizada. No ofrece creación, modificación ni eliminación.
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - create
          - deactivate
          - delete
          - export
          - issue
          - login
          - logout
          - payment
          - permission_denied
          - system
          - update
        description: |-
          * `create` - Creación
          * `update` - Modificación
          * `deactivate` - Desactivación
          * `delete` - Eliminación
          * `login` - Inicio de sesión
          * `logout` - Cierre de sesión
          * `permission_denied` - Acceso denegado
          * `export` - Exportación
          * `issue` - Emisión
          * `payment` - Pago
          * `system` - Sistema
      - in: query
        name: entity_id
        schema:
          type: string
      - in: query
        name: entity_type
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - in: path
        name: tenant_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - tenants
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/tenants/{tenant_id}/audit-events/{id}/:
    get:
      operationId: tenants_audit_events_retrieve
      description: |-
        API de consulta del historial de auditoría.

