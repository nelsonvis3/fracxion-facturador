  /api/tenants/{tenant_id}/invoices/:
    get:
      operationId: tenants_invoices_list
      description: |-
        API de facturación interna.

        Permite listar, crear borradores, consultar y emitir
        facturas dentro de la empresa autorizada.

        No permite modificar ni eliminar documentos mediante
        los endpoints genéricos.
      parameters:
      - in: query
        name: currency
        schema:
          type: string
      - in: query
        name: document_kind
        schema:
          type: string
          enum:
          - credit_note
          - debit_note
          - invoice
        description: |-
          * `invoice` - Factura interna
          * `credit_note` - Nota de crédito
          * `debit_note` - Nota de débito
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - draft
          - issued
        description: |-
          * `draft` - Borrador
          * `issued` - Emitido
      - in: path
        name: tenant_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - tenants
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvoiceReadList'
          description: ''
    post:
      operationId: tenants_invoices_create
      description: |-
        Valida la entrada y delega la creación al servicio
        transaccional. Los importes se calculan en el backend.
      parameters:
      - in: path
        name: tenant_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - tenants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceDraftCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceRead'
          description: ''
  /api/tenants/{tenant_id}/invoices/{id}/:
    get:
