  /api/tenants/{tenant_id}/payments/:
    get:
      operationId: tenants_payments_list
      description: |-
        API para consultar pagos, registrar cobros y revertirlos.

        Todos los registros se limitan a la empresa autorizada.
      parameters:
      - in: query
        name: invoice
        schema:
          type: string
          format: uuid
      - in: query
        name: method
        schema:
          type: string
          enum:
          - bank_transfer
          - cash
          - check
          - credit_card
          - debit_card
          - digital_wallet
          - other
        description: |-
          * `cash` - Efectivo
          * `bank_transfer` - Transferencia bancaria
          * `debit_card` - Tarjeta de débito
          * `credit_card` - Tarjeta de crédito
          * `digital_wallet` - Billetera virtual
          * `check` - Cheque
          * `other` - Otro
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - in: path
        name: tenant_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - tenants
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaymentReadList'
          description: ''
    post:
      operationId: tenants_payments_create
      description: Registra un pago mediante el servicio transaccional.
