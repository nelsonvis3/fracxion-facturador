          - cuil
          - cuit
          - dni
          - other
        description: |-
          * `cuit` - CUIT
          * `cuil` - CUIL
          * `dni` - DNI
          * `other` - Otro
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: province
